<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeknikBlog | Anchor Sistemi</title>
    <meta name="description" content="Geliştiriciler için HTML çapa (anchor) sisteminin kod örnekleri ve detayları.">
</head>
<body>
    <h1 id="sayfa-basi">Sayfa İçi Çapa (Anchor) Sistemi</h1>
    <p>HTML'de sayfa içi geçişler yapmak için href="#id" mantığı kullanılır.</p>
    <br><br>
    <h2>Kod Örneği</h2>
    <pre><code>
&lt;a href="#sayfa-basi"&gt;Yukarı Çık&lt;/a&gt;
    </code></pre>
        <a href="#sayfa-basi"><img src="yukariok.svg" alt="" width="10">Yukarı Çık</a>
    
</body>
</html>
