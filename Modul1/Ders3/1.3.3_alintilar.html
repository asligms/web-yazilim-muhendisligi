<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alıntılar ve Referanslar</title>
</head>
<body>
    
    <blockquote cite="https://tr.wikipedia.org/wiki/Steve_Jobs">Tasarım sadece nasıl göründüğü veya
    nasıl hissettirdiği değildir.Tasarım, onun nasıl çalıştığıdır.</blockquote>
    <!-- Alıntı -->
    <p><cite>steve Jobs</cite></p>
    <!-- yazar belirtmek için -->
    <p>Albert Einstein bir defasında <q>Hayal gücü bilgiden daha önemlidir</q> diyerek yaratıcılığın önemini vurgulamıştır.</p>
    <!-- q etiketi tırnak yapar -->
    <p>Web sayfalarının iskeleti <abbr title="HTML">HTML</abbr> ile kurulur.</p>
    
</body>
</html>
