<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders 4 - Sırasız Listeler</title>
</head>
<body>
    <h1>Sırasız Listeler</h1>

    <!-- deprecated kullanım bu alttaki -->
    <ul type="square">     
        <li>Yumurta</li>
        <li>Süt</li>
        <li>Ekmek</li>
    </ul>
    <!-- ul>li*5 -->
     <!-- doğru kullanım -->
      <!-- disc, square, circle ile değiştirilebilir -->
       <!-- madde işaretini kaldırmak için none kullanılır. -->
     <ul style="list-style-type: none;">     
        <li>Yumurta</li>
        <li>Süt</li>
        <li>Ekmek</li>
    </ul>

</body>
</html>
